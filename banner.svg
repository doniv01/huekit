<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
  <rect width="1280" height="320" fill="#fafaf8" rx="16"/>

  <text x="64" y="86" font-size="14" fill="#9a9a90" font-weight="500" letter-spacing="0.12em">HUEKIT</text>
  <text x="64" y="138" font-size="44" fill="#1a1a1a" font-weight="500" letter-spacing="-0.02em">@huekit/hex</text>
  <text x="64" y="172" font-size="18" fill="#6b6b62" font-weight="400">Convert hex colors to oklch() CSS strings.</text>
  <text x="64" y="196" font-size="18" fill="#6b6b62" font-weight="400">Zero dependencies. ~1kb. The first piece of the OKLCH toolkit.</text>

  <text x="64" y="248" font-family="'SF Mono', ui-monospace, monospace" font-size="14" fill="#8a8a82" font-weight="400">$ npm install @huekit/hex</text>

  <rect x="780" y="64" width="180" height="80" rx="12" fill="#3b82f6"/>
  <text x="870" y="98" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)" font-weight="500" letter-spacing="0.08em">INPUT</text>
  <text x="870" y="124" text-anchor="middle" font-size="18" fill="white" font-weight="600" font-family="'SF Mono', ui-monospace, monospace">#3b82f6</text>

  <line x1="976" y1="104" x2="1036" y2="104" stroke="#c8c8c0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="1036,99 1046,104 1036,109" fill="#c8c8c0"/>

  <rect x="1056" y="64" width="180" height="80" rx="12" fill="#3b82f6"/>
  <text x="1146" y="92" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)" font-weight="500" letter-spacing="0.08em">OUTPUT</text>
  <text x="1146" y="116" text-anchor="middle" font-size="14" fill="white" font-weight="600" font-family="'SF Mono', ui-monospace, monospace">oklch(0.62</text>
  <text x="1146" y="134" text-anchor="middle" font-size="14" fill="white" font-weight="600" font-family="'SF Mono', ui-monospace, monospace">0.19 260)</text>

  <text x="780" y="184" font-size="12" fill="#9a9a90" font-weight="500" letter-spacing="0.06em">GRADIENT QUALITY</text>

  <defs>
    <linearGradient id="g-srgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94fa0"/>
      <stop offset="100%" stop-color="#2dc7e4"/>
    </linearGradient>
    <linearGradient id="g-oklch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94fa0"/>
      <stop offset="50%" stop-color="#a87ed4"/>
      <stop offset="100%" stop-color="#2dc7e4"/>
    </linearGradient>
  </defs>
  <rect x="780" y="196" width="456" height="28" rx="6" fill="url(#g-srgb)"/>
  <text x="780" y="244" font-size="11" fill="#9a9a90">sRGB · muddy midpoint</text>

  <rect x="780" y="256" width="456" height="28" rx="6" fill="url(#g-oklch)"/>
  <text x="780" y="304" font-size="11" fill="#3b6d11" font-weight="500">oklch · smooth arc through hues</text>
</svg>
